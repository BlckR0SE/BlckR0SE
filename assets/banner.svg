<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="260" rx="12" fill="url(#bg)"/>
  <rect width="960" height="260" rx="12" fill="url(#grid)"/>
  <rect width="960" height="260" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Glowing Accent Lines -->
  <line x1="12" y1="12" x2="948" y2="12" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Left Accent Graphic / Monogram Box -->
  <g transform="translate(60, 50)">
    <rect width="160" height="160" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="20" y="20" width="120" height="120" rx="10" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Rose / Geometric Icon -->
    <path d="M 80 40 L 110 65 L 110 105 L 80 130 L 50 105 L 50 65 Z" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="80" cy="85" r="14" fill="#0d1117" stroke="#bc8cff" stroke-width="2"/>
    <circle cx="80" cy="85" r="5" fill="#f778ba"/>
    <line x1="80" y1="40" x2="80" y2="71" stroke="#58a6ff" stroke-dasharray="2 2"/>
    <line x1="80" y1="99" x2="80" y2="130" stroke="#58a6ff" stroke-dasharray="2 2"/>
    <line x1="50" y1="85" x2="66" y2="85" stroke="#bc8cff" stroke-dasharray="2 2"/>
    <line x1="94" y1="85" x2="110" y2="85" stroke="#bc8cff" stroke-dasharray="2 2"/>
  </g>

  <!-- Typography -->
  <g transform="translate(260, 85)">
    <!-- Terminal prefix -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="600" fill="#58a6ff" letter-spacing="2">root@blckr0se:~# system-init</text>
    
    <!-- Main Title -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">
      BlckR0SE <tspan fill="#8b949e" font-weight="300">//</tspan> Architecture &amp; Systems
    </text>

    <!-- Subtitle -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#8b949e">
      Deterministic Agent Engines &middot; Enterprise ERP &middot; Minimalist Code Craft
    </text>

    <!-- Badges / Indicators -->
    <g transform="translate(0, 95)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#3fb950"/>
      <text x="24" y="16" font-family="monospace" font-size="11" fill="#c9d1d9">AGENTS: ON</text>

      <!-- Pill 2 -->
      <rect x="120" y="0" width="125" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="132" cy="12" r="4" fill="#58a6ff"/>
      <text x="144" y="16" font-family="monospace" font-size="11" fill="#c9d1d9">STDLIB-FIRST</text>

      <!-- Pill 3 -->
      <rect x="255" y="0" width="120" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="267" cy="12" r="4" fill="#d29922"/>
      <text x="279" y="16" font-family="monospace" font-size="11" fill="#c9d1d9">TDD VERIFIED</text>
    </g>
  </g>
</svg>
